name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave blank to auto-increment, e.g. v2.2.1-1)'
        required: false
        default: ''
      title:
        description: 'Release Title (leave blank for automatic title)'
        required: false
        default: ''
      notes:
        description: 'Release Notes (Markdown summary of changes)'
        required: false
        default: |
          ### What's Changed
          - **RenoDX for DX12 & Windows Store Games**: 64-bit DXGI games with native DLSS detected now qualify for and recommend the RenoDX (Native DLSS) route, even if detected as `'DirectX 11/12'` or `'DirectX (DXGI)'`.
          - **DirectX 12 Agility SDK Detection**: Added scanner detection for `D3D12Core.dll` and sibling module inspection.
          - **Resilient In-Game Overlay Installation**: Fixed `EPERM` read errors when installing the overlay on encrypted Windows Store / Xbox executables by using detected architecture metadata.
          - **Automatic Cache Invalidation**: Incremented scan cache version so existing library entries refresh automatically.
          - **OptiScaler DLSS-NR for RTX 40 Series**: Unlocked the OptiScaler DLSS-NR route for RTX 40 series GPUs with driver 616.56+.
      draft:
        description: 'Mark as Draft?'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve release version
        id: versioning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPOSITORY: 'rakanki911/DLSS5-Swapper'
        run: node scripts/resolve-version.js "${{ github.event.inputs.tag }}" "${{ github.event.inputs.title }}"

      - name: Prepare build payload
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path "payload\streamline")) {
            Write-Host "Downloading latest upstream release to extract payload..."
            gh release download --repo rakanki911/DLSS5-Swapper --pattern "*portable.exe" --output "upstream-portable.exe" --clobber
            & "C:\Program Files\7-Zip\7z.exe" e "upstream-portable.exe" -o"temp_extracted" "*app-64.7z" -r -y
            & "C:\Program Files\7-Zip\7z.exe" x "temp_extracted\app-64.7z" -o"temp_extracted\inner" "resources\payload\*" -r -y
            Move-Item "temp_extracted\inner\resources\payload" "payload"
            Remove-Item "temp_extracted", "upstream-portable.exe" -Recurse -Force
          }
          if (-not (Test-Path "payload\streamline")) {
            throw "Failed to extract payload: payload\streamline does not exist"
          }
          Write-Host "Payload ready:"
          Get-ChildItem "payload"

      - name: Generate application icons
        run: npm run icon

      - name: Run test suite
        shell: powershell
        run: |
          node --test --test-concurrency=1 (Get-ChildItem test/*.test.js | Select-Object -ExpandProperty FullName)

      - name: Build Windows binaries
        run: npx electron-builder --win portable nsis --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DLSS5-Swapper-Windows-Build
          path: |
            dist/*.exe
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.versioning.outputs.tag || github.ref_name }}
          name: ${{ steps.versioning.outputs.title || github.ref_name }}
          body: ${{ github.event.inputs.notes || '' }}
          generate_release_notes: ${{ github.event.inputs.notes == '' }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
